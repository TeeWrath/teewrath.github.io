<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Social Covers Preview — Subroto Banerjee</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./covers.css" />
</head>
<body class="preview">
<div class="sheet">
  <figure style="--w: 1500; --h: 500">
    <figcaption>X header <span>1500 × 500</span></figcaption>
    <div class="slot"><div class="frame">
      <iframe src="./cover-x.html" title="X header"></iframe>
      <i class="photo" style="--l: 40; --t: 332; --d: 335" data-label="profile photo"></i>
    </div></div>
  </figure>

  <figure style="--w: 1584; --h: 396">
    <figcaption>LinkedIn banner <span>1584 × 396</span></figcaption>
    <div class="slot"><div class="frame">
      <iframe src="./cover-linkedin.html" title="LinkedIn banner"></iframe>
      <i class="photo" style="--l: 47; --t: 196; --d: 300" data-label="profile photo"></i>
    </div></div>
  </figure>

  <figure style="--w: 1640; --h: 720">
    <figcaption>Facebook cover <span>1640 × 720</span></figcaption>
    <div class="slot"><div class="frame">
      <iframe src="./cover-facebook.html" title="Facebook cover"></iframe>
      <i class="safe" style="--l: 180; --t: 48; --sw: 1280; --sh: 624" data-label="safe area · desktop and phone"></i>
      <i class="photo" style="--l: 232; --t: 444; --d: 551" data-label="profile photo · phone"></i>
    </div></div>
  </figure>

  <figure style="--w: 2560; --h: 1440">
    <figcaption>YouTube banner <span>2560 × 1440</span></figcaption>
    <div class="slot"><div class="frame">
      <iframe src="./cover-youtube.html" title="YouTube banner"></iframe>
      <i class="safe" style="--l: 507; --t: 508; --sw: 1546; --sh: 423" data-label="safe area · all devices"></i>
    </div></div>
  </figure>
</div>
</body>
</html>
