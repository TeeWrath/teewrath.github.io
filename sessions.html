<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talks — Subroto Banerjee</title>
    <meta
      name="description"
      content="Talks and sessions given by Subroto Banerjee."
    />

    <link
      rel="shortcut icon"
      href="./assets/images/newpic.jpg"
      type="image/x-icon"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/core.css?v=2" />
    <link rel="stylesheet" href="./assets/css/sections.css?v=2" />

    <meta name="theme-color" content="#0a0a0a" />

    <!-- set theme before paint to avoid flash -->
    <script>
      (function () {
        // dark is the house style — only an explicit user choice overrides it
        var t = "dark";
        try {
          t = localStorage.getItem("theme") || "dark";
        } catch (e) {}
        var d = document.documentElement;
        d.setAttribute("data-theme", t);
        d.classList.add("js");
        if (t === "light")
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#fafafa");
      })();
    </script>
  </head>

  <body data-page="sessions">
    <!-- top bar, menu, footer and ⌘K are shared: assets/js/chrome.js -->
    <script src="./assets/js/chrome.js?v=2"></script>

    <main class="wrap" id="main">
      <header class="page-head">
        <h1 class="page-title enter" style="--i: 0">Talks</h1>
        <p class="page-lede enter" style="--i: 1">
          Sessions I&#39;ve given on open source, Git and GitHub, APIs and
          community building.
        </p>
        <p class="page-meta enter" style="--i: 2">
          <span data-count="sessions">–</span> sessions
        </p>
      </header>

      <div class="page-body">
        <ul class="talks" data-sessions-list data-reveal>
          <li class="state-line">Loading…</li>
        </ul>
      </div>
    </main>

    <script>
      Chrome.footer();
    </script>
    <script src="./assets/js/app.js?v=2"></script>
    <script src="./assets/js/content.js?v=2"></script>
  </body>
</html>
