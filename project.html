    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (function () {
        var t = "dark";
        try {
          t = localStorage.getItem("theme") || "dark";
        } catch (e) {}
        var d = document.documentElement;
        d.setAttribute("data-theme", t);
        d.classList.add("js");
        if (t === "light")
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#fafafa");
      })();
    </script>
