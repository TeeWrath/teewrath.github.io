    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (function () {
        var t = "dark";
        try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#fafafa");
      })();
    </script>
  </head>

  <body>
    <div class="reader-progress" data-progress aria-hidden="true"></div>

      <div class="wrap topbar-inner">

        <a class="back-link" href="./index.html#projects">← <span>All projects</span></a>

        <div class="bar-actions">
          <button class="icon-btn theme-toggle" data-theme-toggle aria-label="Toggle dark / light theme" title="Toggle theme" type="button">

            <svg class="ico icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>

          <a class="btn btn-primary btn-sm" href="./index.html#contact">Hire Me</a>
        </div>
      </div>
    </header>

    <main class="wrap proj-wrap">
