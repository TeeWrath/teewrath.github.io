<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project — Subroto Banerjee</title>

    <link rel="shortcut icon" href="./assets/images/newpic.png" type="image/x-icon" />
    <link rel="stylesheet" href="./assets/css/core.css" />
    <link rel="stylesheet" href="./assets/css/sections.css" />
    <link rel="stylesheet" href="./assets/css/reader.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#080a0c" />
    <script>
      (function () {
        try {
          document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");
        } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
      })();
    </script>
  </head>

  <body>
    <div class="fx-aurora" aria-hidden="true"></div>
    <div class="fx-grid" aria-hidden="true"></div>
    <div class="fx-vignette" aria-hidden="true"></div>
    <div class="fx-grain" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>
    <div class="reader-progress" data-progress aria-hidden="true"></div>

    <header class="mini-bar" data-topbar>
      <a class="brand" href="./index.html" aria-label="Subroto Banerjee — home">
        <span class="brand-mark"><span>SB</span></span>
        <span class="brand-text">
          <span class="brand-name">Subroto Banerjee</span>
          <span class="brand-role">Builder | Creator</span>
        </span>
      </a>

      <div class="bar-actions">
        <a class="back-link" href="./index.html#projects">
          <ion-icon name="arrow-back-outline"></ion-icon>
          <span>All projects</span>
        </a>

        <button
          class="icon-btn theme-toggle"
          data-theme-toggle
          aria-label="Toggle dark / light theme"
          title="Toggle theme"
          type="button"
        >
          <ion-icon class="icon-moon" name="moon-outline"></ion-icon>
          <ion-icon class="icon-sun" name="sunny-outline"></ion-icon>
        </button>

        <a class="btn btn-primary btn-sm btn-sheen" href="./index.html#contact">
          <span>Hire Me</span>
        </a>
      </div>
    </header>

    <main class="proj-wrap">
      <div data-project><p class="proj-state">Loading…</p></div>
    </main>

    <!-- GISCUS config is shared with the blog; edit it in post.html or here -->
    <script>
      window.GISCUS = {
        repo: "TeeWrath/teewrath.github.io",
        repoId: "R_kgDOMJhweA",
        category: "Announcements",
        categoryId: "DIC_kwDOMJhweM4C-v9X"
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./assets/js/project.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  </body>
</html>
